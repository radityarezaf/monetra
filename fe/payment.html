<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Monetra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body{
      background-image: url("img/monetra.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: white;
    }
</style>
</head>


<body>

  <!-- Tombol Back ke Home -->
  <a
    href="index.html"
    id="backHomeBtn"
    class="btn btn-warning rounded position-fixed top-0 start-0 m-4  d-flex align-items-center justify-content-center"
    title="Back to Home"
    style="width: 45px; height: 45px; font-size: 22px;"
  >&larr;</a>

  <div class="container py-5">
    <div class="text-center mb-4">
      <h1 class="text-warning">Payment Confirmation</h1>
      <p>Please review your reservation details below before completing payment.</p>
    </div>

 <div class="card bg-light text-dark p-4 mx-auto rounded-4" style="max-width: 600px;">
    <h4 class="text-center">Reservation Details</h4>
    <p><strong>Name:</strong> <span id="resName"></span></p>
    <p><strong>Notes:</strong> <span id="resNotes"></span></p>
    <p><strong>Price:</strong> <span id="resPrice"></span></p>
  </div>
</div>

    <div id="qrisSection" class="text-center mb-4" style="display:none;">
      <h5>Scan QRIS to Pay</h5>
      <img src="img/qris.jpg" alt="QRIS Payment" class="img-fluid" style="max-width: 250px;">
    </div>

    <div class="text-center">
      <button class="btn btn-warning px-4" id="confirmPayment">Confirm Payment</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name");
    const notes = params.get("notes");
    const price = params.get("price");

    document.getElementById("resName").textContent = name || "-";
    document.getElementById("resNotes").textContent = notes || "-";
    document.getElementById("resPrice").textContent = price ? "Rp " + Number(price).toLocaleString("id-ID") : "-";

    document.getElementById("confirmPayment").addEventListener("click", () => {
      document.getElementById("qrisSection").style.display = "block";
      alert("Payment confirmed! Thank you, " + name);
    });
  </script>
</body>
</html>
