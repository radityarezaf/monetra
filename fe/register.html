<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="login.css" />
</head>
<body class="text-light">
  <a
  href="index.html" id="backHomeBtn" class="btn btn-warning rounded position-fixed top-0 start-0 m-4 d-flex align-items-center justify-content-center" title="Back to Home">
  &larr;
  </a>

  <div class="container d-flex flex-column align-items-center justify-content-center vh-100">
    <div class="row shadow rounded overflow-hidden" style="max-width: 800px; width: 100%;">
      <div class="col-md-6 bg-light text-dark p-4">
        <h3 class="text-center text-warning mb-4">Sign Up</h3>
        <form id="registerForm">
          <div class="mb-3">
            <label>Name</label>
            <input type="text" id="registerName" class="form-control" required />
          </div>
          <div class="mb-3">
            <label>Email</label>
            <input type="email" id="registerEmail" class="form-control" required />
          </div>
          <div class="mb-3">
            <label>Password</label>
            <input type="password" id="registerPassword" class="form-control" required />
          </div>
          <button type="submit" class="btn btn-warning w-100">Register</button>
        </form>
        <p class="mt-3 text-center">
          Already have an account?
          <a href="login.html" class="text-warning">Login</a>
        </p>
      </div>
      
    <div class="col-md-6 p-0">
      <div class="login-image h-100">
      </div>
    </div>
    </div>
    <script src="register.js"></script>
  </body>
</html>
